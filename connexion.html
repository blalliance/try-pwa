<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - BL Alliance</title>
    <link rel="stylesheet" href="style/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html">
                <img src="assets/logo2.png" alt="BL Alliance Logo" class="logo-auth">
            </a>
            <h1>Bon retour !</h1>
            <p>Connectez-vous pour continuer vos recherches.</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="phone">Numéro de téléphone</label>
                <div class="input-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phone" placeholder="+243..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Votre mot de passe" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePass('password', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary-auth">Se connecter</button>
        </form>

        <div class="auth-footer">
            <p>Vous n'avez pas de compte ? <a href="inscription.html">S'inscrire</a></p>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>
    </div>

    <script src="script/auth.js"></script>
</body>
</html>
