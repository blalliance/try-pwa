<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - BL Alliance</title>
    <link rel="stylesheet" href="style/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html">
                <img src="assets/logo2.png" alt="BL Alliance Logo" class="logo-auth">
            </a>
            <h1>Créer un compte</h1>
            <p>Rejoignez la communauté pour trouver votre partenaire idéal.</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="fullname">Nom complet</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullname" placeholder="Ex: Jean Mukendi" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Numéro de téléphone</label>
                <div class="input-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phone" placeholder="+243..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="dob">Date de naissance</label>
                <div class="input-icon">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="date" id="dob" required>
                </div>
            </div>

            <div class="form-group">
                <label for="gender">Sexe</label>
                <div class="input-icon">
                    <i class="fas fa-venus-mars"></i>
                    <select id="gender" required>
                        <option value="" disabled selected>Choisir votre sexe</option>
                        <option value="homme">Homme</option>
                        <option value="femme">Femme</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Votre mot de passe" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePass('password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmez mot de passe</label>
                <div class="input-icon">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirm-password" placeholder="Répétez le mot de passe" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePass('confirm-password', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary-auth">S'inscrire</button>
        </form>

        <div class="auth-footer">
            <p>Vous avez un compte ? <a href="connexion.html">Connexion</a></p>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>
    </div>

    <script src="script/auth.js"></script>
</body>
</html>
